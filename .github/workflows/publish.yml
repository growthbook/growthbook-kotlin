# Publishes to Maven Central. release-please.yml calls this after a release PR merges; run it
# manually to retry a failed publish.
# Every publishable module is considered; a module whose version is already on Maven Central
# is skipped, so only the modules a release bumped are published.
name: Publish to Maven Central

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      ref:
        description: Tag, branch or commit to publish, such as a release tag to retry. Defaults to the branch the run starts from.
        required: false
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish to Maven Central
    # Apple (iOS/macOS) targets only build on macOS
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Empty, the default, for release runs
          ref: ${{ inputs.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Konan
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('build.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Choose the modules to publish
        id: modules
        run: |
          tasks=""
          for module in Core GrowthBookKotlinxSerialization GrowthBook GrowthBookCaffeine GrowthBookExt GrowthBookOpenFeature GrowthBookTest NetworkDispatcherKtor NetworkDispatcherOkHttp; do
            version=$(sed -nE 's/^version = "([^"]+)".*$/\1/p' "$module/build.gradle.kts")
            status=$(curl -s -o /dev/null -w '%{http_code}' \
              "https://repo1.maven.org/maven2/io/growthbook/sdk/$module/$version/$module-$version.pom")
            if [ "$status" = "200" ]; then
              echo "$module $version is already on Maven Central; skipping"
            else
              echo "$module $version will be published"
              tasks="$tasks :$module:publish"
            fi
          done
          echo "tasks=$tasks" >> "$GITHUB_OUTPUT"

      - name: Build, sign and upload to the Sonatype staging repository
        if: steps.modules.outputs.tasks != ''
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PRIVATE_PASSWORD: ${{ secrets.GPG_PRIVATE_PASSWORD }}
          GB_SONATYPE_USERNAME: ${{ secrets.GB_SONATYPE_USERNAME }}
          GB_SONATYPE_PASSWORD: ${{ secrets.GB_SONATYPE_PASSWORD }}
          PUBLISH_TASKS: ${{ steps.modules.outputs.tasks }}
        run: ./gradlew $PUBLISH_TASKS

      # The upload isn't visible on central.sonatype.com until it's transferred.
      # publishing_type=automatic releases it to Maven Central once Sonatype's validation passes.
      # Sonatype files each upload under the IP it came from, and a macOS runner's requests don't
      # always leave from one IP, so find the open uploads from any IP and transfer each by key.
      - name: Transfer the upload to Maven Central
        if: steps.modules.outputs.tasks != ''
        env:
          GB_SONATYPE_USERNAME: ${{ secrets.GB_SONATYPE_USERNAME }}
          GB_SONATYPE_PASSWORD: ${{ secrets.GB_SONATYPE_PASSWORD }}
        run: |
          token=$(printf '%s:%s' "$GB_SONATYPE_USERNAME" "$GB_SONATYPE_PASSWORD" | base64 | tr -d '\n')
          echo "::add-mask::$token"
          api=https://ossrh-staging-api.central.sonatype.com/manual
          # The logs are public, so hide IP addresses
          redact() { sed -E 's/[0-9]{1,3}(\.[0-9]{1,3}){3}/<ip>/g'; }

          status=$(curl -s -o repositories.json -w '%{http_code}' \
            -H "Authorization: Bearer $token" \
            "$api/search/repositories?ip=any&profile_id=io.growthbook.sdk&state=open")
          echo "Search: HTTP $status"
          if [ "${status:0:1}" != "2" ]; then
            redact < repositories.json
            exit 1
          fi
          keys=$(jq -r '.repositories[].key' repositories.json)
          if [ -z "$keys" ]; then
            echo "No open uploads found"
            exit 1
          fi

          failed=0
          while IFS= read -r key; do
            # Keys contain slashes
            encoded=$(jq -rn --arg key "$key" '$key | @uri')
            status=$(curl -s -o response.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $token" \
              "$api/upload/repository/$encoded?publishing_type=automatic")
            echo "Transfer $(printf '%s' "$key" | redact): HTTP $status"
            redact < response.json
            echo
            if [ "${status:0:1}" != "2" ]; then
              failed=1
            fi
          done <<< "$keys"
          exit $failed
