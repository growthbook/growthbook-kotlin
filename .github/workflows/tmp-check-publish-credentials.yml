# TEMPORARY: read-only look at the Sonatype staging repositories. Remove before merging.
name: Temporary credential check

on:
  push:
    branches: [chore/release-10.0.0]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Staging repositories (IP fields removed)
        env:
          SONATYPE_USERNAME: ${{ secrets.GB_SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.GB_SONATYPE_PASSWORD }}
        run: |
          set -euo pipefail
          token=$(printf '%s:%s' "$SONATYPE_USERNAME" "$SONATYPE_PASSWORD" | base64 -w0)
          echo "::add-mask::$token"
          for state in open closed released; do
            echo "== state=$state"
            curl -s -H "Authorization: Bearer $token" \
              "https://ossrh-staging-api.central.sonatype.com/manual/search/repositories?ip=any&state=$state" \
              | jq 'walk(if type == "object" then with_entries(select(.key | test("ip"; "i") | not)) else . end)'
          done
