# TEMPORARY: checks the Maven Central publishing secrets without publishing anything.
# Prints only status codes, key fingerprints, dates and yes/no results. Remove before merging.
name: Temporary credential check

on:
  push:
    branches: [chore/release-10.0.0]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Sonatype Central Portal user token
        env:
          SONATYPE_USERNAME: ${{ secrets.GB_SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.GB_SONATYPE_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$SONATYPE_USERNAME" ] && echo "username secret: set" || echo "username secret: EMPTY"
          [ -n "$SONATYPE_PASSWORD" ] && echo "password secret: set" || echo "password secret: EMPTY"
          token=$(printf '%s:%s' "$SONATYPE_USERNAME" "$SONATYPE_PASSWORD" | base64 -w0)
          echo "::add-mask::$token"
          # Read-only search; a Central Portal user token gets 200, an old OSSRH token 401
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" \
            "https://ossrh-staging-api.central.sonatype.com/manual/search/repositories?ip=any")
          echo "OSSRH Staging API search: HTTP $code"

      - name: GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PRIVATE_PASSWORD: ${{ secrets.GPG_PRIVATE_PASSWORD }}
        run: |
          set -uo pipefail
          export GNUPGHOME=$(mktemp -d)
          if printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import >/dev/null 2>&1; then
            echo "import: ok"
          else
            echo "import: FAILED"
            exit 1
          fi
          # Fingerprint, creation and expiry of the primary key and subkeys (no user IDs)
          gpg --batch --list-secret-keys --with-colons --fixed-list-mode | awk -F: '
            $1=="sec" || $1=="ssb" { type=$1; created=$6; expires=$7; caps=$12 }
            $1=="fpr" && type!="" {
              exp = (expires=="" ? "never" : strftime("%Y-%m-%d", expires))
              printf "%s fpr=%s created=%s expires=%s capabilities=%s\n", type, $10, strftime("%Y-%m-%d", created), exp, caps
              type=""
            }'
          echo test > probe.txt
          if gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PRIVATE_PASSWORD" --detach-sign probe.txt >/dev/null 2>&1; then
            echo "sign with passphrase: ok"
          else
            echo "sign with passphrase: FAILED"
          fi
          fpr=$(gpg --batch --list-secret-keys --with-colons --fixed-list-mode | awk -F: '$1=="fpr"{print $10; exit}')
          for url in "https://keys.openpgp.org/vks/v1/by-fingerprint/$fpr" "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x$fpr"; do
            echo "public key on $(echo "$url" | cut -d/ -f3): HTTP $(curl -s -o /dev/null -w '%{http_code}' "$url")"
          done
